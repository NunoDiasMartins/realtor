[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "house-hunting-agent"
version = "0.1.0"
description = "A deterministic, local-first house listing collection pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
house-agent = "house_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/house_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
